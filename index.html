<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Idle Island</title>
<meta name="description" content="An idle base-defence game for the browser. Build up a small island while raiders row in by longboat, train squads to hold the beaches, and sail on to new islands for permanent upgrades. Plays on desktop and mobile.">
<meta name="theme-color" content="#1a4150">
<meta property="og:type" content="website">
<meta property="og:title" content="Idle Island">
<meta property="og:description" content="Hold the isle. The longboats are coming. An idle base-defence game you play in the browser.">
<meta property="og:url" content="https://gorzaweba.github.io/Idle-Island/">
<meta property="og:image" content="https://gorzaweba.github.io/Idle-Island/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a4150'/%3E%3Cellipse cx='16' cy='22' rx='12' ry='5.5' fill='%23d9c48c'/%3E%3Cellipse cx='16' cy='20.5' rx='9.5' ry='4.2' fill='%2377a253'/%3E%3Cpath d='M15.2 4.5v15' stroke='%233a2a1c' stroke-width='1.6'/%3E%3Cpath d='M16 5.5h8.5l-1 8.5H16z' fill='%23efe6d2'/%3E%3Cpath d='M16 8.6h8.1v2.3H16z' fill='%239b2f28'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!--BODY-START-->
<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-name">Idle Island</span>
      <span class="trait-chip" id="trait-chip" title=""></span>
    </div>
    <div class="resources">
      <div class="res" title="Gold">
        <svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.5" fill="var(--coin)"/><circle cx="10" cy="10" r="4.6" fill="none" stroke="var(--coin-dark)" stroke-width="1.6"/></svg>
        <span class="res-val" id="gold">0</span><span class="res-rate" id="gold-rate">+0/s</span>
      </div>
      <div class="res" title="Timber">
        <svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="7" width="16" height="7" rx="3.5" fill="var(--wood)"/><circle cx="15" cy="10.5" r="3" fill="var(--wood-light)"/></svg>
        <span class="res-val" id="timber">0</span><span class="res-rate" id="timber-rate">+0/s</span>
      </div>
      <div class="res" id="renown-res" title="Renown" hidden>
        <svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2l2.2 5 5.3.4-4 3.5 1.3 5.2L10 13.3 5.2 16.1l1.3-5.2-4-3.5 5.3-.4z" fill="var(--renown)"/></svg>
        <span class="res-val" id="renown">0</span>
      </div>
    </div>
    <div class="wavebox">
      <div class="wave-main">
        <span class="wave-label">Wave</span>
        <span class="wave-num" id="wave">1</span>
      </div>
      <div class="wave-sub">
        <span id="wave-status">Boats sighted</span>
        <span class="wave-best" id="wave-best"></span>
      </div>
      <div class="wave-actions">
        <button class="btn btn-small" id="call-btn" data-act="call-now" title="Bring the boats in now for bonus gold">Call now</button>
        <button class="toggle" id="advance-btn" data-act="advance" aria-pressed="true" title="When on, each victory moves you to the next wave">Advance</button>
      </div>
    </div>
    <div class="controls" role="group" aria-label="Game speed">
      <button class="seg" data-act="speed" data-arg="1" id="spd-1">1×</button>
      <button class="seg" data-act="speed" data-arg="2" id="spd-2">2×</button>
      <button class="seg" data-act="speed" data-arg="3" id="spd-3">3×</button>
      <button class="seg" data-act="pause" id="pause-btn" aria-pressed="false" title="Pause (Space)">Pause</button>
    </div>
  </header>

  <main class="layout">
    <section class="stage" id="stage">
      <canvas id="cv" aria-label="The island"></canvas>
      <div class="stage-banner" id="banner" hidden><strong id="banner-title"></strong><span id="banner-sub"></span></div>
      <div class="stage-hover" id="hover-line" hidden></div>
      <div class="ghost-chip" id="ghost-chip" hidden></div>
      <div class="floaters" id="floaters" aria-hidden="true"></div>
      <div class="stage-zoom" role="group" aria-label="Map zoom">
        <button class="zoom-btn" data-act="zoom-in" id="zoom-in" aria-label="Zoom in" title="Zoom in (or pinch / scroll)">+</button>
        <button class="zoom-btn" data-act="zoom-out" id="zoom-out" aria-label="Zoom out" title="Zoom out">−</button>
        <button class="zoom-btn" data-act="recentre" id="recentre" aria-label="Show the whole island" title="Show the whole island">
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="10" cy="10" r="5.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10 1.5v4M10 14.5v4M1.5 10h4M14.5 10h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="stage-paused" id="paused-veil" hidden>Paused</div>
    </section>
    <div class="stage-mode" id="mode-line" role="status" hidden>
      <span id="mode-text"></span>
      <button class="mode-cancel" id="mode-cancel" data-act="cancel-modes" hidden>Cancel</button>
    </div>

    <aside class="panel">
      <div class="hint" id="hint" hidden></div>
      <nav class="tabs" role="tablist">
        <button class="tab" role="tab" data-act="tab" data-arg="build" id="tab-build">Build</button>
        <button class="tab" role="tab" data-act="tab" data-arg="squads" id="tab-squads">Squads</button>
        <button class="tab" role="tab" data-act="tab" data-arg="sagas" id="tab-sagas">Sagas</button>
        <button class="tab" role="tab" data-act="tab" data-arg="chronicle" id="tab-chronicle">Chronicle</button>
      </nav>
      <div class="panel-body" id="panel-body"></div>
    </aside>
  </main>

  <div class="modal-veil" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
      <button class="btn btn-primary" data-act="close-modal" id="modal-ok">Continue</button>
    </div>
  </div>
</div>
<!--BODY-END-->
<script src="js/util.js"></script>
<script src="js/data.js"></script>
<script src="js/island.js"></script>
<script src="js/state.js"></script>
<script src="js/sim.js"></script>
<script src="js/render.js"></script>
<script src="js/vendor/three.min.js"></script>
<script src="js/theme3d.js"></script>
<script src="js/r3d/builder.js"></script>
<script src="js/r3d/terrain.js"></script>
<script src="js/r3d/sea.js"></script>
<script src="js/r3d/models.js"></script>
<script src="js/r3d/unitmodels.js"></script>
<script src="js/r3d/fx.js"></script>
<script src="js/r3d/props.js"></script>
<script src="js/r3d/camera.js"></script>
<script src="js/r3d/picking.js"></script>
<script src="js/r3d/buildings.js"></script>
<script src="js/r3d/units.js"></script>
<script src="js/r3d/missiles.js"></script>
<script src="js/r3d/ui3d.js"></script>
<script src="js/render3d.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
